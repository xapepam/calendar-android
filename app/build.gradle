plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.xapepam.calendar'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.xapepam.calendar'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Для локальной сети: не минифицируем, чтобы сборка была предсказуемой.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
